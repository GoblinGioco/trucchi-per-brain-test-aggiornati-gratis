[pytest]
# Configurazione dei parametri di esecuzione di default per i test
addopts = --maxfail=2 -rf --duration=10

# Directory escluse dalla scansione dei test automatizzati
norecursedirs = *.egg .git .venv __pycache__ build dist

# Pattern di riconoscimento dei file e delle classi di test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Definizione dei marker per categorizzare i test
markers =
    core: test relativi alle funzionalità principali dell'algoritmo
    performance: test di benchmark relativi alla velocità di esecuzione
